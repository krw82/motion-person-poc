name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests without model downloads or input videos
        run: python -m pytest tests -q
      - name: Build and install the Python package without bundling model weights
        run: python -m pip install . --no-deps
      - name: Import the installed package outside the checkout import path
        run: |
          python -I - <<'PY'
          import sys
          import types
          sys.modules['config'] = types.ModuleType('unrelated_host_config')
          from motion_person import MotionEngine, EventConfig
          assert EventConfig().max_duration_sec == 10
          assert MotionEngine.webcam(display=False).capture is False
          PY
