[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-person"
version = "0.2.0"
description = "Fixed-camera YOLO and MOG2 motion event photo bundles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opencv-python", "numpy", "ultralytics==8.4.174", "lap>=0.5.12"]

[project.optional-dependencies]
test = ["pytest", "imageio-ffmpeg", "matplotlib"]

[project.scripts]
motion-person = "motion_person.cli:main"

[tool.setuptools.packages.find]
include = ["motion_person*"]

[tool.setuptools.package-data]
motion_person = ["py.typed"]
